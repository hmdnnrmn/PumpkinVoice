name: Build and Linting

on:
  push:
  pull_request:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  format:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      - run: cargo fmt --check

  clippy:
    name: Run clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable && rustup target add wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --target wasm32-wasip2 --all-targets --all-features

  build:
    name: Build project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable && rustup target add wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target wasm32-wasip2
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pumpkin-voice-wasm
          path: target/wasm32-wasip2/release/*.wasm
          compression-level: 9
          if-no-files-found: error
      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Release ${{ github.ref_name }}"
          tag_name: "${{ github.ref_name }}"
          draft: false
          files: target/wasm32-wasip2/release/*.wasm
