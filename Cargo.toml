[package]
name = "pumpkin_voice"
version = "1.1.0"
edition = "2024"
authors = ["hmdnnrmn"]
description = "Simple Voice Chat integration for PumpkinMC"
license = "GPL-3.0"

[lib] 
crate-type = ["cdylib"]

[dependencies]
pumpkin-plugin-api = { git = "https://github.com/Pumpkin-MC/Pumpkin.git", branch = "master", package = "pumpkin-plugin-api" }
# We need this for WASM component generation
wit-bindgen = "0.57"

# WASM compatible logging
tracing = "0.1"

# Crypto - need to ensure these are WASM compatible
# aes-gcm might need 'aes' and 'ghash' features or similar
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
rand = { version = "0.8", features = ["small_rng"] }

# UUID
uuid = { version = "1.10", features = ["v4", "serde"] }

# Bytes
bytes = "1.7"
byteorder = "1.5"
serde = { version = "1.0", features = ["derive"] }
toml = "1.0"

[profile.release] 
lto = true
strip = "debuginfo"
codegen-units = 1
